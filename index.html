<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFABUZZ AI REALITY</title>
<style>
body{background:#101827;color:white;text-align:center;font-family:Arial;padding:15px}
video{width:100%;background:#263449;border-radius:15px}
button{background:#00b5a5;padding:16px;margin:8px;border:0;border-radius:12px;font-size:18px}
</style>
</head>
<body>
<h1>FIFABUZZ AI REALITY</h1>
<p>Samsung Front Camera Test</p>
<video id="cam" autoplay playsinline muted></video>
<p id="status">Camera ready</p>
<button onclick="startCamera()">Start Camera</button>
<button onclick="stopCamera()">Stop Camera</button>
<script>
let stream;
async function startCamera(){
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
document.getElementById("cam").srcObject=stream;
document.getElementById("status").textContent="Camera working!";
}catch(e){
document.getElementById("status").textContent="Camera error: "+e.message;
}
}
function stopCamera(){
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
document.getElementById("cam").srcObject=null;
document.getElementById("status").textContent="Camera stopped";
}
</script>
</body>
</html>
